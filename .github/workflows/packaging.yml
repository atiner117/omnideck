name: packaging

# Validates the AUR PKGBUILD: lints it, checks .SRCINFO is in sync, builds the package in a
# clean Arch container, and lints the result. Two modes, chosen automatically:
#   * release tarball for $pkgver EXISTS  -> strict: download it, verify b2sums, build —
#     proves "a stranger running makepkg gets a working package".
#   * tag not pushed yet (pre-release)    -> build the CURRENT CHECKOUT as the source
#     (checksums skipped; they belong to the future tarball) — proves the PKGBUILD still
#     builds this tree instead of failing red on a guaranteed 404 until the tag lands.
# Release flow stays: bump pkgver -> tag v$pkgver -> updpkgsums + regenerate .SRCINFO;
# that post-tag updpkgsums push touches packaging/** and runs the strict mode against the
# real artifact. (No `tags:` trigger on purpose: combined with `paths:` filters GitHub
# skips tag pushes of already-pushed commits — the post-tag push is the reliable hook.)

on:
  push:
    branches: [main]
    paths: ['packaging/**', '.github/workflows/packaging.yml']
  pull_request:
    paths: ['packaging/**', '.github/workflows/packaging.yml']
  workflow_dispatch:

jobs:
  aur:
    name: AUR PKGBUILD · makepkg + namcap (Arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pick the mode (see header): strict release-tarball validation when the tag for
      # $pkgver exists, otherwise synthesize the source from this checkout so the job
      # proves the PKGBUILD builds the tree it rides with. git archive uses the same
      # top-level dir name (omnideck-$pkgver/) as GitHub's tag tarballs, so prepare()
      # and build() are byte-for-byte the same paths either way.
      - name: Select source (release tarball vs current checkout)
        run: |
          pkgver=$(grep -oP '^pkgver=\K.*' packaging/PKGBUILD)
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${pkgver}.tar.gz"
          # Only a definitive 404 means "tag not pushed yet". A bare `curl -sf` treated ANY
          # failure (429 rate limit, 5xx, DNS blip) as no-tag and silently skipped checksum
          # validation — a false-green packaging check on a real release.
          code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url" || echo 000)
          if [ "$code" = "200" ]; then
            echo "release tarball for v${pkgver} exists — strict mode (download + b2sums)"
            echo "MAKEPKG_EXTRA=" >> "$GITHUB_ENV"
          elif [ "$code" = "404" ]; then
            echo "no v${pkgver} tag yet — building the current checkout (checksums skipped)"
            git archive --format=tar.gz --prefix="omnideck-${pkgver}/" \
              -o "packaging/omnideck-${pkgver}.tar.gz" HEAD
            echo "MAKEPKG_EXTRA=--skipchecksums" >> "$GITHUB_ENV"
          else
            echo "::error::cannot tell whether the v${pkgver} tarball exists (HTTP ${code}) — refusing to guess a mode; re-run the job"
            exit 1
          fi
      # Run the Arch toolchain in a container; checkout stays on the host (which has git).
      - name: makepkg + namcap
        run: |
          docker run --rm -e MAKEPKG_EXTRA -v "$PWD:/repo:ro" archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed \
              base-devel sudo rust pkgconf webkit2gtk-4.1 hicolor-icon-theme namcap curl ca-certificates unzip
            # bun is declared as the AUR makedep bun-bin; install the official binary for CI.
            curl -fsSL https://bun.sh/install | bash
            install -m755 /root/.bun/bin/bun /usr/local/bin/bun

            # makepkg refuses to run as root.
            useradd -m builder
            cp -a /repo /home/builder/src
            chown -R builder:builder /home/builder/src
            cd /home/builder/src/packaging

            # namcap exits 0 even on findings, so gate on ERROR (E:) lines ourselves.
            gate() { cat "$1"; if grep -q " E: " "$1"; then echo "::error::namcap reported errors"; exit 1; fi; }

            echo "::group::namcap PKGBUILD"
            runuser -u builder -- namcap PKGBUILD > /tmp/n1.txt 2>&1; gate /tmp/n1.txt
            echo "::endgroup::"

            echo "::group::.SRCINFO in sync with PKGBUILD"
            runuser -u builder -- makepkg --printsrcinfo > /tmp/gen.srcinfo
            diff -u .SRCINFO /tmp/gen.srcinfo || { echo "::error::.SRCINFO is stale — run: makepkg --printsrcinfo > .SRCINFO"; exit 1; }
            echo "::endgroup::"

            echo "::group::makepkg build"
            # $MAKEPKG_EXTRA is expanded by THIS (root) shell before runuser execs, so
            # builder does not need the env var (and must not inherit root HOME).
            runuser -u builder -- makepkg -f --noconfirm --nodeps $MAKEPKG_EXTRA
            echo "::endgroup::"

            echo "::group::namcap package"
            runuser -u builder -- bash -c "namcap omnideck-*.pkg.tar.zst" > /tmp/n2.txt 2>&1; gate /tmp/n2.txt
            echo "::endgroup::"
          '

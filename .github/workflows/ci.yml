name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · test · build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 webview deps (WebKitGTK 4.1). Keep in sync with README "Requirements".
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libudev-dev \
            pkg-config \
            build-essential curl wget file libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned (not "latest") so a breaking Bun release can't flip CI red overnight; floor
          # for the bun.lock text format (lockfileVersion 1). Bump deliberately with the lockfile.
          bun-version: "1.2.0"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Svelte type-check
        run: bun run check

      - name: Frontend unit tests
        run: bun run test

      - name: Frontend build
        run: bun run build

      - name: clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --release

      # The Rust structs are the source of truth for the TS types (ts-rs). Regenerate and
      # fail if the committed bindings drifted — a struct change must ship its bindings.
      - name: IPC bindings in sync (ts-rs)
        working-directory: src-tauri
        run: |
          TS_RS_EXPORT_DIR="$PWD/../src/lib/bindings" cargo test --release export_bindings
          # -N (intent-to-add) so a brand-new generated binding that was never committed shows
          # up in `git diff` too — a plain diff ignores untracked files, so a MISSING binding
          # (e.g. a freshly `ts(export)`-ed struct) would otherwise pass as a false green.
          git add --intent-to-add ../src/lib/bindings
          git diff --exit-code ../src/lib/bindings \
            || { echo "::error::src/lib/bindings is stale — run: cd src-tauri && TS_RS_EXPORT_DIR=\$PWD/../src/lib/bindings cargo test export_bindings"; exit 1; }

      - name: Tauri build (no bundle)
        run: bun run tauri build --no-bundle

  # The browser half of the "Verify" ladder (CLAUDE.md §3). Separate from `build` because it
  # needs a browser download and no Rust at all, so it runs in parallel instead of adding
  # minutes to the long job.
  e2e:
    name: e2e (screenshot tour · chromium + webkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in lockstep with the `build` job's pin.
          bun-version: "1.2.0"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # First, and deliberately before the browser download: this is a plain `tsc --noEmit`
      # over the fixtures, which are typed off the generated ts-rs bindings. A Rust struct
      # change that the fixtures don't account for fails HERE, in seconds, instead of being
      # found by hand later — the harness's whole point. No browser needed to catch it.
      - name: Harness typecheck (fixtures match the ts-rs bindings)
        run: bun run check:e2e

      # bun skips browser-download postinstalls for untrusted packages, so `bun install` above
      # does NOT fetch the engines — they have to be installed explicitly.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        # --with-deps pulls the apt packages WebKit needs. On an Ubuntu runner both engines
        # just work; the ICU/libxml2/flite shimming in e2e/install-webkit-deps.sh is only for
        # rolling distros, so it is deliberately NOT used here.
        run: bunx playwright install --with-deps chromium webkit

      # Both engines on purpose: webkit is the closest match to the WebKitGTK webview that
      # actually ships, chromium is the stable fast path. They render differently enough that
      # a regression can land in one and not the other.
      - name: Screenshot tour
        run: bunx playwright test

      - name: Upload screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            e2e/screenshots
            e2e/.results
          retention-days: 7
          if-no-files-found: ignore

  cargo-deny:
    name: cargo-deny (advisories · licenses · bans · sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./src-tauri/Cargo.toml

  cargo-audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  version-sync:
    name: version sync (all five version sources agree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions agree
        run: |
          cargo_v=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          tauri_v=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"(.*)".*/\1/')
          pkg_v=$(grep -m1 '^pkgver=' packaging/PKGBUILD | cut -d= -f2)
          json_v=$(grep -m1 '"version"' package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"(.*)".*/\1/')
          # The omnideck crate's own entry in Cargo.lock (the line right after its name).
          lock_v=$(grep -A1 '^name = "omnideck"$' src-tauri/Cargo.lock | grep -m1 '^version' | sed -E 's/.*"(.*)".*/\1/')
          echo "Cargo.toml=$cargo_v  tauri.conf.json=$tauri_v  PKGBUILD=$pkg_v  package.json=$json_v  Cargo.lock=$lock_v"
          if [ "$cargo_v" != "$tauri_v" ] || [ "$cargo_v" != "$pkg_v" ] \
             || [ "$cargo_v" != "$json_v" ] || [ "$cargo_v" != "$lock_v" ]; then
            echo "::error::version strings disagree — bump all five together (see RELEASING.md §1)"; exit 1
          fi

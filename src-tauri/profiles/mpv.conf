# omnideck-generated v1 — OmniDeck's display-aware mpv profile set.
# Rewritten by OmniDeck whenever the detected hardware changes; to hand-tune a copy,
# delete this first line and OmniDeck will never touch the file again (or set
# [media_server] mpv_args / auto_profiles=false in config.toml to opt out entirely).
# {{TIER_INFO}}

# --- Video ---
# high-quality is the modern gpu-hq: ewa_lanczossharp scaling + better downscale + HDR
# peak detection — GPU-side upscaling, so no VapourSynth-side upscale profiles needed.
profile=high-quality
# gpu-next = the libplacebo renderer: better HDR tone mapping, which matters because the
# VapourSynth profiles preserve 10-bit instead of crushing to 8-bit.
vo=gpu-next
# auto-copy keeps hardware decode compatible with the VapourSynth filters (they need
# CPU-side frames); plain nvdec/vaapi would silently disable the vf chain.
hwdec=auto-copy
# Sync video to the display clock (smooth pacing at high refresh), resample audio to match.
video-sync=display-resample
# Per-dimension playback toggles (interpolation/upscale/denoise/deband/stretch on
# independent keys instead of preset combo-profiles) + the seek self-heal for
# interpolation. See the .lua for the key map (F9 = show current state).
scripts-append={{PROFILE_DIR}}/omnideck-toggles.lua
# NB: no `input-conf=` here on purpose. The F-keys are bound by the Lua script (script
# bindings), and pointing input-conf at our reference file would REPLACE the user's own
# ~/.config/mpv/input.conf for OmniDeck-launched playback — all their personal bindings
# gone — while adding none of ours. input.conf in this directory is documentation only.
scale-antiring=0.7
# The real "stretch 8-bit toward 10-bit" tool: gpu-next processes internally at high bit
# depth; deband reconstructs smooth gradients from banded 8-bit sources before dithering
# to the display. Biggest visible win on streaming-grade encodes (skies, dark scenes).
deband=yes

# --- Audio ---
# NB: no forced resampler. An earlier revision pinned `af=aresample=resampler=soxr`, but on
# mpv builds whose FFmpeg lacks libsoxr an af chain fails CLOSED at init (video plays with
# no audio; audio-only files refuse to start) — mpv does not drop a failing filter. The
# default swresample path is correct for video-sync=display-resample; if your build carries
# soxr, add the line back in a user-owned copy (delete line 1 to take ownership).
# Optional forced output samplerate (config [media_server] audio_samplerate; e.g. 96000 for a
# fixed-rate DAC / LDAC headphones). Blank = leave mpv's native rate (bit-perfect).
{{AUDIO_SAMPLERATE_LINE}}

# Playback starts clean: no filters until toggled (the .vpy scripts themselves refuse to
# double-interpolate high-rate sources, so no auto-profile guard is needed). The old
# preset combo-profiles ([interpolate-basic] et al) are gone — dimensions are toggled
# independently at runtime by omnideck-toggles.lua; a profile matrix that multiplied
# stretch x interpolation x denoise x deband would need 24 profiles and 24 keys.

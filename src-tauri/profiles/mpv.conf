# omnideck-generated v1 — OmniDeck's display-aware mpv profile set.
# Rewritten by OmniDeck whenever the detected hardware changes; to hand-tune a copy,
# delete this first line and OmniDeck will never touch the file again (or set
# [media_server] mpv_args / auto_profiles=false in config.toml to opt out entirely).
# {{TIER_INFO}}

# --- Video ---
# high-quality is the modern gpu-hq: ewa_lanczossharp scaling + better downscale + HDR
# peak detection — GPU-side upscaling, so no VapourSynth-side upscale profiles needed.
profile=high-quality
# gpu-next = the libplacebo renderer: better HDR tone mapping, which matters because the
# VapourSynth profiles preserve 10-bit instead of crushing to 8-bit.
vo=gpu-next
# auto-copy keeps hardware decode compatible with the VapourSynth filters (they need
# CPU-side frames); plain nvdec/vaapi would silently disable the vf chain.
hwdec=auto-copy
# Sync video to the display clock (smooth pacing at high refresh), resample audio to match.
video-sync=display-resample
# NB: the option is `input-conf` — the shim set's `input-conf-path` never existed in
# mpv and fails to parse (so its F-key line silently did nothing in plain mpv).
input-conf={{PROFILE_DIR}}/input.conf
scale-antiring=0.7
# The real "stretch 8-bit toward 10-bit" tool: gpu-next processes internally at high bit
# depth; deband reconstructs smooth gradients from banded 8-bit sources before dithering
# to the display. Biggest visible win on streaming-grade encodes (skies, dark scenes).
deband=yes

# --- Audio ---
# soxr resampler via an explicit aresample filter (mpv has no `audio-resampler` option;
# the resampler is selected through the af chain). Matters for video-sync=display-resample.
af=aresample=resampler=soxr

# --- Default profile ---
profile=passthrough

# --- Base profiles (F-keys switch at runtime; see input.conf) ---
[passthrough]
vf=
panscan=0.0

[denoise]
vf=vapoursynth:{{PROFILE_DIR}}/denoise.vpy
panscan=0.0

[interpolate-basic]
vf=vapoursynth:{{PROFILE_DIR}}/interpolate-basic.vpy
panscan=0.0

[interpolate-ultra]
vf=vapoursynth:{{PROFILE_DIR}}/interpolate-ultra.vpy
panscan=0.0

# --- Stretched variants (zoom to fill, crops edges) ---
[passthrough-stretched]
profile=passthrough
panscan=1.0

[denoise-stretched]
profile=denoise
panscan=1.0

[interpolate-basic-stretched]
profile=interpolate-basic
panscan=1.0

[interpolate-ultra-stretched]
profile=interpolate-ultra
panscan=1.0

# --- Auto-profile: high-rate sources never get interpolated on top ---
[high-fps-auto]
# `or 0`: container_fps is nil until the demuxer populates it, and a bare `nil > 59`
# throws "attempt to compare number with nil" on every profile-cond re-evaluation.
profile-cond=(container_fps or 0) > 59
profile=passthrough

# omnideck-generated v1 — profile-switching keybindings for OmniDeck's mpv profile set.
# Delete this first line to take ownership (OmniDeck stops rewriting the file).
# {{TIER_INFO}}

# F1: Passthrough — no VapourSynth filters (best for VFR sources and already-smooth video)
F1 apply-profile passthrough

# F2: Passthrough, stretched/zoomed to fill the screen
F2 apply-profile passthrough-stretched

# F3: Denoise (KNLMeansCL, GPU OpenCL)
F3 apply-profile denoise

# F4: Basic interpolation (MVTools BlockFPS) — targets the FULL display rate
F4 apply-profile interpolate-basic

# F5: Basic interpolation, stretched
F5 apply-profile interpolate-basic-stretched

# F6: Ultra interpolation (MVTools FlowFPS, optical flow) — targets display/2 above
#     100 Hz and stays inside the CPU's pixel-rate budget (declines 4K sources on modest
#     CPUs rather than desync; F4 basic still takes those to the full display rate)
F6 apply-profile interpolate-ultra

# F7: Ultra interpolation, stretched
F7 apply-profile interpolate-ultra-stretched

# F8: Denoise, stretched
F8 apply-profile denoise-stretched

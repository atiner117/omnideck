# omnideck-generated v1 — key reference for OmniDeck's mpv profile set.
# Delete this first line to take ownership (OmniDeck stops rewriting the file).
# {{TIER_INFO}}
#
# The playback controls are per-dimension TOGGLES, bound by omnideck-toggles.lua
# (not by this file — script bindings survive user input.conf overrides):
#
#   F1  reset       everything off, defaults restored
#   F2  stretch     fill the screen (panscan) on/off
#   F3  denoise     KNLMeansCL on/off (composes with interpolation)
#   F4  interpolate off -> smooth (full display rate) -> ultra (display/2, optical flow)
#   F5  upscaling   high (ewa_lanczossharp) -> regular (spline36) -> off (bilinear)
#   F6  tone smooth deband (8-bit -> 10-bit gradients) on/off
#   F9  status      show the current state of everything
#
# Seeking while interpolation is on self-heals automatically (the script rebuilds the
# filter after every seek — the old "audio drifts after skipping on ultra" bug).
#
# This file is a REFERENCE — it is not loaded by mpv (your own ~/.config/mpv/input.conf
# stays in charge), and OmniDeck rewrites it when the profile set changes. Put personal
# bindings in your mpv input.conf, or take ownership of this file by deleting line 1.
